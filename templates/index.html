<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComfyUI 漫画上色</title>
<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:920px;margin:32px auto;padding:0 18px;color:#222}fieldset{border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}label{display:block;margin:10px 0}textarea,input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:6px}textarea{min-height:74px}button{padding:10px 18px;border:0;border-radius:7px;background:#1769aa;color:#fff;cursor:pointer}.status{padding:10px;background:#f5f5f5;border-radius:8px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><h1>ComfyUI 漫画上色</h1><p>使用 Qwen 图片编辑工作流，由 RTX 2080 Ti 与 RTX 5060 Ti 两个 ComfyUI 服务并行处理。</p>
<div id="services" class="status">正在检查 ComfyUI 服务…</div>
<form id="form"><fieldset><legend>输入文件</legend><label>图片 / PDF / ZIP / CBZ（可多选）<input type="file" name="files" multiple accept="image/*,.pdf,.zip,.cbz"></label><label>文件夹（选择文件夹后自动读取其中图片）<input type="file" name="files" webkitdirectory directory accept="image/*"></label><small>上面两个入口任选其一；压缩包和 PDF 会自动拆页。</small></fieldset>
<fieldset><legend>工作流参数</legend><label>正向提示词<textarea name="positive">给漫画进行上色，颜色不要太淡</textarea></label><label>负向提示词<textarea name="negative">低饱和，灰度，褪色，未上色，模糊，重影，文字变形</textarea></label><div class="grid"><label>宽度（留空使用工作流默认）<input name="width" type="number" min="64" step="8" placeholder="工作流默认"></label><label>高度（留空使用工作流默认）<input name="height" type="number" min="64" step="8" placeholder="工作流默认"></label></div><label>任务名称<input name="title" placeholder="漫画上色"></label></fieldset><button>开始双卡并行上色</button></form><h2>任务状态</h2><div id="status" class="status">尚未提交任务</div><div id="files"></div>
<script>
const services=document.querySelector('#services'),status=document.querySelector('#status'),files=document.querySelector('#files');
async function check(){try{const d=await (await fetch('/api/services')).json();services.textContent='工作流：'+d.workflow+'\n'+d.services.map(x=>x.name+' '+(x.online?'在线':'离线')+' '+(x.device||x.error||'')).join('\n')}catch(e){services.textContent='服务检查失败：'+e}}
check();
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/jobs',{method:'POST',body:new FormData(e.target)});const d=await r.json();if(!r.ok){status.textContent=d.error;return}poll(d.job_id)});
async function poll(id){const d=await (await fetch('/api/jobs/'+id)).json();status.textContent=`${d.status}  ${d.progress}/${d.total}\n${d.message}${d.error?'\n错误：'+d.error:''}\n目录：${d.colored_dir}`;if(d.status==='done'){files.innerHTML='<p>输出文件位于：'+d.colored_dir+'</p>'}else if(d.status!=='error')setTimeout(()=>poll(id),1500)}
</script></body></html>
